<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback: Rucksack Forever</title>
<meta name="description" content="Bug reports and ideas sent for Rucksack, newest first.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="./"><span>Ruck</span><span>sack</span></a>
<nav><a href="./">Home</a><a href="report.html">Report a bug</a><a href="feedback.html" class="on">Feedback</a></nav>
</div></header>
<main class="wrap">
<h1>Feedback</h1>
<p class="lead">Every report and idea, newest first.</p>
<div class="row"><button class="btn quiet" type="button" data-f="all" aria-pressed="true">All</button><button class="btn quiet" type="button" data-f="open" aria-pressed="false">Open</button><button class="btn quiet" type="button" data-f="closed" aria-pressed="false">Fixed</button><a class="btn" href="report.html">Report a bug</a></div>
<div id="list"><p class="hint">Loading.</p></div>
<script src="config.js"></script>
<script>
(function () {
  var list = document.getElementById("list"), all = [], filter = "all";
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function draw() {
    list.textContent = "";
    var shown = all.filter(function (i) { return filter === "all" || i.state === filter; });
    if (!shown.length) { list.appendChild(el("p", "hint", all.length ? "Nothing here." : "No reports yet.")); return; }
    shown.forEach(function (i) {
      var c = el("div", "item");
      c.appendChild(el("h3", "", i.title));
      var m = el("div", "meta");
      m.appendChild(el("span", "tag " + (i.state === "open" ? "open" : "done"), i.state === "open" ? "Open" : "Fixed"));
      m.appendChild(el("span", "", new Date(i.created_at).toLocaleString()));
      m.appendChild(el("span", "", i.comments + (i.comments === 1 ? " reply" : " replies")));
      var a = el("a", "", "Open on GitHub"); a.href = i.html_url; m.appendChild(a);
      c.appendChild(m);
      c.appendChild(el("pre", "", (i.body || "").slice(0, 6000)));
      list.appendChild(c);
    });
  }
  document.querySelectorAll("button[data-f]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-f");
      document.querySelectorAll("button[data-f]").forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); o.style.borderColor = o === b ? "var(--gold)" : ""; });
      draw();
    });
  });
  fetch("https://api.github.com/repos/" + RUCKSACK.repo + "/issues?labels=feedback&state=all&per_page=100&sort=created&direction=desc")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { all = d.filter(function (i) { return !i.pull_request; }); draw(); })
    .catch(function () { list.textContent = ""; list.appendChild(el("p", "hint", "Couldn't load the reports right now. Try again in a few minutes.")); });
})();
</script>
</main>
<footer><div class="wrap">Rucksack Forever is a free addon for World of Warcraft Forever, made by Marijan. <a href="https://github.com/Mustac/RucksackForever">Source on GitHub</a></div></footer>
</body></html>
